[project]
name = "fuel-prices-italy"
version = "0.1.0"
description = "Daily data pipeline on Italian fuel prices: MIMIT open data, EIA and ECB APIs"
readme = "README.md"
authors = [
    { name = "Davide Marino", email = "210675248+dsmarino-dev@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pyright]
# Static type checking used by Pylance in VS Code
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
